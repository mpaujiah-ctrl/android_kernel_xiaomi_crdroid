name: Update KSUN
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 16.0-exp-2
      - name: Replace drivers/kernelsu
        run: |
            git clone --depth 1 --branch v3.4.1 https://github.com/KernelSU-Next/KernelSU-Next.git /tmp/ksun
            rm -rf drivers/kernelsu
            mkdir -p drivers/kernelsu
            cp -a /tmp/ksun/kernel/. drivers/kernelsu/
            rm -f drivers/kernelsu/include/uapi
            mkdir -p drivers/kernelsu/include/uapi
            cp /tmp/ksun/uapi/*.h drivers/kernelsu/include/uapi/
            sed -i 's/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := 33333/' drivers/kernelsu/Kbuild
            git apply -p2 --directory=drivers/kernelsu patches/ksun-3.4.0-legacy-susfs.patch
     
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A drivers/kernelsu
          git commit -m "kernelsu: update KernelSU-Next to v3.4.1" || echo "nothing to commit"
          git push
